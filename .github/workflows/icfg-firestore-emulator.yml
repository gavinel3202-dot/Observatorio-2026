name: Integración Firestore aislada ICFG
on:
  push:
    branches:
      - feature/edicion-evaluaciones-autorizadas
    paths:
      - 'api/_lib/correctionService.js'
      - 'src/correctionDraft.js'
      - 'src/icfg.js'
      - 'tests/firestoreEmulator.integration.js'
      - 'firebase.emulator.json'
      - '.github/workflows/icfg-firestore-emulator.yml'

permissions:
  contents: read

jobs:
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar emulador y transacciones con datos ficticios
        env:
          GCLOUD_PROJECT: demo-icfg-corrections
        run: >
          npx --yes firebase-tools@14 emulators:exec
          --only firestore --project demo-icfg-corrections
          --config firebase.emulator.json
          "node --test tests/firestoreEmulator.integration.js tests/icfgApi.emulator.integration.js"
